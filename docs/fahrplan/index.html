<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahrplan</title>
<style>
  :root{
    --bg:#fafaf8; --fg:#1a1a1a; --muted:#666; --accent:#0d6e6e; --accent-soft:#e3f0f0;
    --card:#fff; --border:#e2e2de; --done:#0ca30c; --done-soft:#e8f5e8; --grey:#8a8a84;
    --track:#e9e9e5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1a19; --fg:#ececea; --muted:#a3a39e; --accent:#5fc2c2; --accent-soft:#17343a;
      --card:#232322; --border:#36362f; --done:#3fbf3f; --done-soft:#1a2f1a; --grey:#8a8a84;
      --track:#2c2c2a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1a19; --fg:#ececea; --muted:#a3a39e; --accent:#5fc2c2; --accent-soft:#17343a;
    --card:#232322; --border:#36362f; --done:#3fbf3f; --done-soft:#1a2f1a; --grey:#8a8a84;
    --track:#2c2c2a;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--fg);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:720px; margin:0 auto; padding:24px 16px 48px}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  h1{font-size:22px; margin:0}
  h1 small{font-weight:400; color:var(--muted); font-size:13px; margin-left:8px}
  button{font:inherit; font-size:13px; color:var(--fg); background:var(--card);
         border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer}
  .progress{margin:18px 0 6px}
  .track{height:6px; background:var(--track); border-radius:3px; overflow:hidden}
  .fill{height:100%; background:var(--done); border-radius:3px}
  .summary{color:var(--muted); font-size:13px; margin:6px 0 0}
  .summary b{color:var(--fg); font-weight:600}
  h2{font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
     margin:28px 0 8px; display:flex; justify-content:space-between}
  ol{list-style:none; margin:0; padding:0}
  li{display:grid; grid-template-columns:22px 26px 1fr auto; gap:6px 8px; align-items:baseline;
     padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card);
     margin-bottom:6px}
  li .icon{font-size:14px; text-align:center}
  li .num{color:var(--muted); font-variant-numeric:tabular-nums}
  li .tag{font-size:12px; color:var(--muted); white-space:nowrap}
  li .note{grid-column:3 / span 2; color:var(--muted); font-size:13px}
  li .learn{grid-column:3 / span 2; font-size:13px; margin-top:2px}
  li .learn b{color:var(--accent); font-weight:600; font-size:12px;
              text-transform:uppercase; letter-spacing:.04em}
  li.done{color:var(--muted)} li.done .icon{color:var(--done)}
  li.done .title{text-decoration:line-through; text-decoration-color:var(--grey)}
  li.current{background:var(--accent-soft); border-color:var(--accent)}
  li.current .icon,li.current .tag{color:var(--accent)} li.current .title{font-weight:600}
  li.optional .icon,li.optional .title{color:var(--muted)}
  .aside{margin-top:28px; padding:10px 12px; border-left:3px solid var(--border);
         color:var(--muted); font-size:13px}
  .aside ul{margin:4px 0 0; padding-left:18px}
  footer{margin-top:28px; color:var(--muted); font-size:12px; border-top:1px solid var(--border);
         padding-top:10px}
  footer code{font-size:12px}
</style>
<script>
  // Apply a stored theme before first paint; falls back to the system setting.
  try{ const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){}
</script>
</head>
<body>
<main>
  <header>
    <h1>Fahrplan <small id="stand"></small></h1>
    <button id="theme" type="button"></button>
  </header>
  <div class="progress"><div class="track"><div class="fill" id="fill"></div></div>
    <p class="summary" id="summary"></p></div>
  <div id="phases"></div>
  <div class="aside" id="aside"></div>
  <footer>Quelle der Wahrheit ist <code>docs/agentcontext/PROJECT.md</code>, diese Seite ist die
    Sicht darauf. Ein Schritt ist ein abgegrenzter Arbeitsblock mit eigenem Ergebnis, ungefähr eine
    Session.</footer>
</main>

<script>
// Maintenance: flip a step's status (done | current | open | optional), set STAND, and flip a
// concept marker in `learn` (0 unlearned, 1 skimmed, 2 understood) when Henry says so. That is all.
const STAND = "2026-09-19";
const STEPS = [
  {n:1,  phase:"1 · Einarbeitung", status:"done",
   title:"GPT-2 small in TransformerLens: Anatomie, Tokenizer, Cache und Hook-Namen", note:"2026-09-05"},
  {n:2,  phase:"1 · Einarbeitung", status:"done",
   title:"Attention-Muster, Logit Lens, Residual-Normen, BOS-Senke", note:"2026-09-05"},
  {n:3,  phase:"1 · Einarbeitung", status:"done",
   title:"Induction Heads reproduzieren, Zero-Ablation mit Zufallskontrolle", note:"2026-09-05"},

  {n:4,  phase:"2 · Schnuppertour", status:"done",
   title:"Activation Patching auf dem Induction-Setup: Clean/Corrupt, Restoration", note:"2026-09-16"},
  {n:5,  phase:"2 · Schnuppertour", status:"done",
   title:"Steering auf GPT-2: Difference-in-Means-Richtung addieren, Zufallsvektor als Kontrolle", note:"2026-09-18"},
  {n:6,  phase:"2 · Schnuppertour", status:"done",
   title:"Linear Probing auf den Residual Stream", note:"2026-09-18"},
  {n:7,  phase:"2 · Schnuppertour", status:"done",
   title:"Gemma-2-2B-Tour: TL-Version entscheiden, laden, Cache-Kosten, BOS, Induction Heads", note:"2026-09-18"},
  {n:8,  phase:"2 · Schnuppertour", status:"done",
   title:"SAE-Blick: eine Feature-Richtung durch den Dosis-Sweep", note:"2026-09-18"},

  {n:9,  phase:"3 · Forschungsstand", status:"done",
   title:"Eine Seite Landkarte: Methode × Modell × Messung × offene Lücke, aus DETAILS",
   note:"2026-09-18 · details/forschungsstand.md"},

  {n:10, phase:"4 · Entscheidung", status:"done",
   title:"Kandidaten gegen Kriterien halten, eine Sache wählen: Methode, Modell, Frage, Kontrolle, Anker",
   note:"2026-09-19 · Lesen gegen Steuern"},

  {n:11, phase:"5 · Vertiefung", status:"done",
   title:"Die ein, zwei Papers zur gewählten Sache im Volltext lesen",
   note:"2026-09-19 · Billa + Tiwari, beide Notizen korrigiert"},
  {n:12, phase:"5 · Vertiefung", status:"done",
   title:"Plan schreiben und das bekannte Ergebnis als Anker reproduzieren",
   note:"2026-09-19 · 07_reading_vs_steering.ipynb, sechs Familien"},
  {n:13, phase:"5 · Vertiefung", status:"done",
   title:"Das eigene Experiment mit Kontrolle durchführen, reproduzierbar machen",
   note:"2026-09-19 · 08_direction_sources.ipynb, vier Quellen bei gleicher Wirkung"},

  {n:14, phase:"6 · Abhandlung", status:"done",
   title:"Struktur und Kernaussagen der Abhandlung abstimmen",
   note:"2026-09-19 · plans/abhandlung.md, Kernaussagen beim Schreiben von Abschnitt 5 bestätigt"},

  {n:15, phase:"7 · Schreiben", status:"done",
   title:"Vorarbeit: Typst auf Englisch, Figuren als Vektor exportieren",
   note:"2026-09-19 · main.typ englisch und neu gegliedert, refs.bib angelegt, 07/08 neu gelaufen"},
  {n:16, phase:"7 · Schreiben", status:"done",
   title:"Abschnitt 5 · Reading versus steering — der Hauptteil",
   note:"2026-09-19 geschrieben, ~4,6 Seiten · Verständnisrunde läuft, Nachschärfen in Schritt 22",
   learn:[[0,"A_lin: Logit Lens als Vorhersage, nicht als Beschreibung"],
          [0,"Lesen ist nicht Steuern (continent: überall lesbar, nirgends steuerbar)"],
          [0,"relative Dosis und die Dosis-Konfundierung des Ankers"],
          [0,"Vergleich bei gleichem KL statt bei gleicher Dosis"],
          [0,"Kontrollen: Zufallsboden als Bestes aus fünf, Bodenfälle parity/continent"],
          [0,"erklärte Varianz ist blind für das Konzept (Rekonstruktionsfehler)"]]},
  {n:17, phase:"7 · Schreiben", status:"done",
   title:"Abschnitt 4 · Choosing the question",
   note:"2026-09-19 geschrieben, ~1 Seite · Landkarte samt Suchprotokoll · Kandidat D und warum · Anker Billa · zweite Arbeit Tiwari · die zwei Lücken",
   learn:[[0,"Billas Kernaussage und seine Go/No-Go-Schwelle"],
          [0,"Tiwaris Substrat-Argument und warum es bei uns kein Gate ist"],
          [0,"warum Kandidat D gegen A–F gewann"]]},
  {n:18, phase:"7 · Schreiben", status:"done",
   title:"Abschnitt 3 · Exploration: one station per method",
   note:"2026-09-19 geschrieben, ~1,4 Seiten · Tour als eine Tabelle (6 Stationen) · was ins Hauptexperiment floss · Modellwahl mit der A_lin-Vorabmessung",
   learn:[[0,"Activation Patching: Clean/Corrupt und Restoration"],
          [0,"Steering über die Mittelwertdifferenz, Dosis-Sweep"],
          [0,"Probing und die Control Task"],
          [0,"SAE-Feature als Richtung (Encoder sucht, Decoder steuert)"],
          [0,"warum GPT-2 small und nicht Gemma-2-2B"]]},
  {n:19, phase:"7 · Schreiben", status:"done",
   title:"Abschnitt 2 · Background: four ways to look inside",
   note:"geschrieben 2026-09-19 · eigene Typst-Grafik des Residual Streams · LRH in drei Sätzen · vier Methoden als Tabelle: misst was, setzt voraus, scheitert woran",
   learn:[[0,"Residual Stream als gemeinsamer Arbeitsraum"],
          [0,"Linear Representation Hypothesis (offener Punkt aus PROJECT)"],
          [0,"Unembedding und Logit Lens"],
          [0,"Sparse Autoencoder: was die Sparsity kaufen soll"]]},
  {n:20, phase:"7 · Schreiben", status:"done",
   title:"Abschnitt 6 · Conclusion",
   note:"geschrieben 2026-09-19 · Ergebnisse in sechs Sätzen · Abschnitt 7 auf Henrys Ansage gestrichen, KI-Nutzung steht jetzt als Kasten unter dem Abstract",
   learn:[[0,"Interpretationsdisziplin: gemessen gegen gedeutet trennen"]]},
  {n:21, phase:"7 · Schreiben", status:"done",
   title:"Abschnitt 1 · Introduction, danach Abstract",
   note:"erledigt 2026-09-19 · Introduction ¾ Seite (XAI-Achsen nach Gilpin, Haltung, Lesehinweis), Abstract fünf Sätze, Anhangstabelle · danach ein Review-Durchgang: Zahlen-Inkonsistenzen behoben, Redundanzen gestrichen, LLM-Klang halbiert, zwei Grafiken dazu (Dosis pro Schicht, Schema der drei Vergleichsarten)",
   learn:[[0,"XAI-Landschaft: post-hoc und modellagnostisch gegen mechanistisch"]]},
  {n:22, phase:"7 · Schreiben", status:"current",
   title:"Henrys Leserunde: Verständnis für Abschnitt 5 nachschärfen, abgeben",
   note:"Henry liest und fragt, Sätze in eigene Worte · offen: drei Literatureinträge ohne note-Feld, „5 of 23" beim Anker prüfen, Untertitel · Tag v1.0-submission setzen, Selbstzitat-Links prüfen",
   learn:[[0,"die fünf Kernaussagen frei erklären können"]]},
];
const ASIDE = [
  "Grokking-Beispiel (Nanda, Addition mod 113) durcharbeiten, fürs Verständnis",
];

const LEARN = ["\u2b1c", "\ud83d\udfe1", "\u2705"];  // unlearned, skimmed, understood -- as in learning.md

const STATUS = {
  done:     {icon:"✓", label:"erledigt"},
  current:  {icon:"▶", label:"aktuell"},
  open:     {icon:"○", label:"offen"},
  optional: {icon:"◇", label:"optional"},
};

// Header, progress bar and summary line
document.getElementById("stand").textContent = "Stand " + STAND;
const done = STEPS.filter(s => s.status === "done").length;
const counted = STEPS.filter(s => s.status !== "optional").length;
document.getElementById("fill").style.width = Math.round(100 * done / counted) + "%";
const cur = STEPS.find(s => s.status === "current");
document.getElementById("summary").innerHTML =
  `<b>${done} von ${counted}</b> Schritten erledigt` +
  (cur ? ` · aktuell: <b>${cur.n} ${cur.title}</b>` : "");

// Phases in first-seen order, each with its own done/total count
const box = document.getElementById("phases");
for (const phase of [...new Set(STEPS.map(s => s.phase))]) {
  const steps = STEPS.filter(s => s.phase === phase);
  const pd = steps.filter(s => s.status === "done").length;
  const pt = steps.filter(s => s.status !== "optional").length;
  const h = document.createElement("h2");
  h.innerHTML = `<span>${phase}</span><span>${pd}/${pt}</span>`;
  const ol = document.createElement("ol");
  for (const s of steps) {
    const st = STATUS[s.status];
    const li = document.createElement("li");
    li.className = s.status;
    li.innerHTML = `<span class="icon">${st.icon}</span><span class="num">${s.n}</span>` +
      `<span class="title">${s.title}</span><span class="tag">${st.label}</span>` +
      (s.note ? `<span class="note">${s.note}</span>` : "") +
      (s.learn ? `<span class="learn"><b>verstehen</b> ` +
        s.learn.map(([m, c]) => `${LEARN[m]} ${c}`).join(" · ") + `</span>` : "");
    ol.appendChild(li);
  }
  box.append(h, ol);
}
document.getElementById("aside").innerHTML =
  "Nebenbei offen, kein eigener Schritt:<ul>" + ASIDE.map(a => `<li>${a}</li>`).join("") + "</ul>";

// Theme toggle: switches away from the currently effective theme and remembers the choice
const root = document.documentElement, btn = document.getElementById("theme");
const effective = () => root.dataset.theme ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const setLabel = () => btn.textContent = effective() === "dark" ? "☀ Hell" : "☾ Dunkel";
btn.onclick = () => {
  const next = effective() === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  setLabel();
};
setLabel();
</script>
</body>
</html>
